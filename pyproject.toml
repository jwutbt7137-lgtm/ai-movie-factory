[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-movie-factory"
version = "0.4.0"
description = "AI电影解说工厂 —— 面向个人创作者的电影解说自动化制作工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Movie Factory" }]
dependencies = [
    "PySide6>=6.7,<7",
    "pydantic>=2.7,<3",
    "scenedetect>=0.6.4,<0.8",
    "opencv-python>=4.8,<5",
    "numpy>=2.0,<3",
    "faster-whisper>=1.0.3,<2",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
# 可选：Piper 本地语音（需自行准备有合法许可的中文 ONNX 模型）
local-tts = [
    "piper-tts>=1.8",
]

[project.scripts]
aimovie = "aimovie.cli:main"
aimovie-gui = "aimovie.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: 需要下载语音模型或真实转写的集成测试（默认跳过，设置 AIMF_RUN_INTEGRATION=1 启用）",
    "ffmpeg: 需要本机 ffmpeg/ffprobe 的测试",
    "ui: 需要 Qt 的界面测试",
]
